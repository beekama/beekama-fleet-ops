apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: beekama-github
spec:
  image: renovate/renovate:44.257.5
  provider:
    name: github

  discoveryFilters:
    - beekama/adventcalendar
    - beekama/beekama-fleet-ops
    - beekama/mail-autoconfig

  secretRef: renovate-github-beekama

  # required fields
  schedule: "0 2 * * *"
  parallelism: 3

  # set the webhook
  webhook:
    enabled: true
    authentication:
      enabled: true
      secretRef:
        name: renovate-github-beekama-webhook
        key: RENOVATE_WEBHOOK_TOKEN


  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  access:
    adminGroups:
      - harbor-admins

    readerGroups:
      - tools

    anonymousRead: false
    anonymousReadLogs: false

  extraEnv:
    - name: RENOVATE_ASSIGNEES
      value: '["beekama"]'

    - name: RENOVATE_CONFIG
      value: |
        {
          "pip_requirements": {
            "managerFilePatterns": [
              "/(^|/)req\\.txt$/"
            ]
          }
        }

    - name: RENOVATE_ONBOARDING_CONFIG
      value: |
        {
          "extends": [
            "config:recommended"
          ]
        }
